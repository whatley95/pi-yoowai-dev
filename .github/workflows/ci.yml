name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 22 only: the npm test script passes a glob to the test runner,
        # which requires Node >= 22 (Node 20 fails to resolve it).
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Required compatibility job: checks types and focused integration suites
  # against a disposable install pinned to a recent Pi host (0.99.1). The repo
  # itself stays on its >=0.82.1 peer floor; this job only proves the registry
  # adapter against a real newer host, including its actual agent execution loop.
  compat-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage disposable 0.99.1 tree
        run: |
          mkdir -p "$RUNNER_TEMP/pi-yoowai-latest"
          cd "$RUNNER_TEMP/pi-yoowai-latest"
          cat > package.json << 'PKG'
          {
            "name": "pi-yoowai-099-validation",
            "version": "0.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "typecheck": "tsc --noEmit",
              "test-focused": "node --import tsx --test src/file-write-tools.test.ts src/backends/sdk-backend.test.ts src/integration/*.test.ts src/index.test.ts src/wai-vision.test.ts src/secondary-model.test.ts src/auth-reader.test.ts"
            },
            "dependencies": {
              "@earendil-works/pi-agent-core": "0.99.1",
              "@earendil-works/pi-ai": "0.99.1",
              "@earendil-works/pi-coding-agent": "0.99.1",
              "@earendil-works/pi-tui": "0.99.1",
              "@sinclair/typebox": "^0.34.49",
              "@types/node": "^26.0.0",
              "duck-duck-scrape": "^2.2.7",
              "mupdf": "1.28.0",
              "tsx": "^4.0.0",
              "typescript": "^6.0.3"
            }
          }
          PKG
          cp -r "${{ github.workspace }}/src" ./src
          cp -r "${{ github.workspace }}/templates" ./templates
          cp -r "${{ github.workspace }}/design-refs" ./design-refs
          cp -r "${{ github.workspace }}/scripts" ./scripts
          cp "${{ github.workspace }}/tsconfig.json" ./tsconfig.json
          npm install --no-audit --no-fund
      - name: Types and integration suites under 0.99.1
        run: cd "$RUNNER_TEMP/pi-yoowai-latest" && npm run typecheck && npm run test-focused
