name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 22 only: the npm test script passes a glob to the test runner,
        # which requires Node >= 22 (Node 20 fails to resolve it).
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Required compatibility job: checks types and focused integration suites
  # against disposable installs pinned to Pi 1.0.0 and 1.1.0. The repo
  # itself stays on its >=0.82.1 peer floor; this job only proves the registry
  # adapter against a real newer host, including its actual agent execution loop.
  compat-latest:
    strategy:
      fail-fast: false
      matrix:
        pi: ["1.0.0", "1.1.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage disposable Pi ${{ matrix.pi }} tree
        run: |
          mkdir -p "$RUNNER_TEMP/pi-yoowai-latest"
          cd "$RUNNER_TEMP/pi-yoowai-latest"
          cat > package.json << 'PKG'
          {
            "name": "pi-yoowai-host-validation",
            "version": "0.0.0",
            "private": true,
            "type": "module",
            "pi": { "skills": ["./skills/*/SKILL.md"] },
            "scripts": {
              "typecheck": "tsc --noEmit",
              "test-focused": "node --import tsx --test src/file-write-tools.test.ts src/backends/sdk-backend.test.ts src/backends/shared.test.ts src/backends/pi-backend.test.ts src/integration/*.test.ts src/index.test.ts src/wai-vision.test.ts src/secondary-model.test.ts src/auth-reader.test.ts src/actions/scan.test.ts src/actions/test.test.ts src/actions/security.test.ts src/actions/judge.test.ts src/actions/action-context.test.ts src/actions/done.test.ts src/actions/plan-update.test.ts src/plan-editor.test.ts src/plan-store.test.ts src/render.test.ts src/json-read-cache.test.ts src/wai-learn.test.ts src/review-memory.test.ts src/wai-index.test.ts src/tool-loop.test.ts src/actions/review-batching.test.ts src/actions/review-chunks.test.ts src/token-budget.test.ts src/review-level.test.ts src/config.test.ts src/commands/register.test.ts src/format.test.ts src/prompts.test.ts src/actions/review-tool-context.test.ts src/actions/review-helpers.test.ts src/actions/review.test.ts src/native-output-schemas.test.ts src/tool-guidance.test.ts src/review-recovery.test.ts src/skill-guidance.test.ts src/design-ref-defaults.test.ts src/design-ref.test.ts src/instructions.test.ts"
            },
            "dependencies": {
              "@earendil-works/pi-agent-core": "${{ matrix.pi }}",
              "@earendil-works/pi-ai": "${{ matrix.pi }}",
              "@earendil-works/pi-coding-agent": "${{ matrix.pi }}",
              "@earendil-works/pi-tui": "${{ matrix.pi }}",
              "@sinclair/typebox": "^0.34.49",
              "@types/node": "^26.0.0",
              "duck-duck-scrape": "^2.2.7",
              "mupdf": "1.28.0",
              "tsx": "^4.0.0",
              "typescript": "^6.0.3"
            }
          }
          PKG
          cp -r "${{ github.workspace }}/src" ./src
          cp -r "${{ github.workspace }}/templates" ./templates
          cp -r "${{ github.workspace }}/design-refs" ./design-refs
          cp -r "${{ github.workspace }}/skills" ./skills
          cp -r "${{ github.workspace }}/scripts" ./scripts
          cp "${{ github.workspace }}/tsconfig.json" ./tsconfig.json
          npm install --no-audit --no-fund
      - name: Types and integration suites under Pi ${{ matrix.pi }}
        run: cd "$RUNNER_TEMP/pi-yoowai-latest" && npm run typecheck && npm run test-focused
