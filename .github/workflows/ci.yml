name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 22 only: the npm test script passes a glob to the test runner,
        # which requires Node >= 22 (Node 20 fails to resolve it).
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # Advisory compatibility job: runs the focused SDK/lifecycle/vision suites
  # against a disposable install pinned to a recent Pi host (0.86.1). The repo
  # itself stays on its >=0.82.1 peer floor; this job only proves the registry
  # adapter against a real newer host. continue-on-error keeps it advisory.
  compat-086:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage disposable 0.86.1 tree
        run: |
          mkdir -p "$RUNNER_TEMP/pi-yoowai-086"
          cd "$RUNNER_TEMP/pi-yoowai-086"
          cat > package.json << 'PKG'
          {
            "name": "pi-yoowai-086-validation",
            "version": "0.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "test-focused": "node --import tsx --test src/backends/sdk-backend.test.ts src/integration/lifecycle.test.ts src/index.test.ts src/wai-vision.test.ts src/secondary-model.test.ts src/auth-reader.test.ts"
            },
            "dependencies": {
              "@earendil-works/pi-agent-core": "0.86.1",
              "@earendil-works/pi-ai": "0.86.1",
              "@earendil-works/pi-coding-agent": "0.86.1",
              "@earendil-works/pi-tui": "0.86.1",
              "@sinclair/typebox": "^0.34.49",
              "@types/node": "^26.0.0",
              "duck-duck-scrape": "^2.2.7",
              "mupdf": "^1.28.0",
              "tsx": "^4.0.0",
              "typescript": "^6.0.3"
            }
          }
          PKG
          cp -r "${{ github.workspace }}/src" ./src
          cp -r "${{ github.workspace }}/templates" ./templates
          cp "${{ github.workspace }}/tsconfig.json" ./tsconfig.json
          npm install --no-audit --no-fund
      - name: Focused suites under 0.86.1
        run: cd "$RUNNER_TEMP/pi-yoowai-086" && npm run test-focused
